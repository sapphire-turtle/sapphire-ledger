name: Release-plz

# The headless edition (`sapphire-ledger-headless`) and the desktop app share
# one version and its `v{version}` tag, which the headless one makes
# (release-plz.toml). Both binaries are built once release-plz has made the
# release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep the release command and the release PR from racing on the same branch.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: sapphire-turtle/.github/.github/workflows/release-plz.yml@v1
    with:
      # `cargo publish` builds the headless edition and the CLI and server
      # libraries, whose rustls pulls aws-lc-sys (cmake).
      linux-packages: cmake
    secrets: inherit

  build:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-ledger-headless')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-ledger-headless'] }}
