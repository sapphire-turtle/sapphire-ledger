[package]
name = "sapphire-ledger"
version = "0.1.0"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
categories = ["command-line-utilities", "finance"]
keywords = ["accounting", "ledger", "double-entry", "cli", "mcp"]

[lib]
name = "sapphire_ledger"
path = "src/lib.rs"

[[bin]]
name = "sapphire-ledger"
path = "src/main.rs"

[features]
default = ["redb-store"]
redb-store = [
    "sapphire-ledger-core/redb-store",
    "sapphire-ledger-mcp/redb-store",
    "sapphire-framework/redb-store",
]

[dependencies]
sapphire-ledger-api = { path = "../crates/sapphire-ledger-api", version = "2.0.0" }
sapphire-ledger-core = { path = "../crates/sapphire-ledger-core", version = "0.1.0", default-features = false }
sapphire-ledger-mcp = { path = "../crates/sapphire-ledger-mcp", version = "0.1.0", default-features = false }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
