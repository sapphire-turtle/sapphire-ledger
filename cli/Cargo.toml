[package]
name = "sapphire-ledger"
version = "0.2.2"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
categories = ["command-line-utilities", "finance"]
keywords = ["accounting", "ledger", "double-entry", "cli", "mcp"]

[lib]
name = "sapphire_ledger"
path = "src/lib.rs"

[[bin]]
name = "sapphire-ledger"
path = "src/main.rs"

[features]
default = ["redb-store"]
redb-store = [
    "sapphire-ledger-core/redb-store",
    "sapphire-ledger-mcp/redb-store",
    "sapphire-framework/redb-store",
]

[dependencies]
sapphire-ledger-api = { path = "../crates/sapphire-ledger-api", version = "2.1.0" }
sapphire-ledger-core = { path = "../crates/sapphire-ledger-core", version = "0.3.1", default-features = false }
sapphire-ledger-mcp = { path = "../crates/sapphire-ledger-mcp", version = "0.2.2", default-features = false }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

# `cargo binstall sapphire-ledger` downloads the release file instead of building it, following
# sapphire-turtle/.github's README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
