[package]
name = "sapphire-ledger-cli"
edition.workspace = true
# Released together with the two editions that run it, `sapphire-ledger-headless`
# and `sapphire-ledger-desktop` (release-plz.toml).
version = "0.3.0"
description = "The command line of sapphire-ledger's two editions, the headless one and the desktop app: the ledger's commands and the framework's, which run the app server or call it"
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "finance"]
keywords = ["accounting", "ledger", "double-entry", "cli", "mcp"]

[features]
default = ["redb-store"]
redb-store = [
    "sapphire-ledger-core/redb-store",
    "sapphire-ledger-server/redb-store",
]

[dependencies]
sapphire-ledger-core = { path = "../sapphire-ledger-core", version = "0.3.0", default-features = false }
sapphire-ledger-server = { path = "../sapphire-ledger-server", version = "0.3.0", default-features = false }
sapphire-framework = { workspace = true, features = ["server", "ipc", "mcp"] }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
