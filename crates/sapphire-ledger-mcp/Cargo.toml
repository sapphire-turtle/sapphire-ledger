[package]
name = "sapphire-ledger-mcp"
version = "0.1.0"
edition.workspace = true
description = "MCP tools for sapphire-ledger: the ledger's methods on its app server, and the tools that call them"
license.workspace = true
repository.workspace = true
categories = ["finance"]
keywords = ["accounting", "ledger", "mcp", "double-entry"]

[features]
default = ["redb-store"]
redb-store = ["sapphire-ledger-core/redb-store"]

[dependencies]
sapphire-ledger-api = { path = "../sapphire-ledger-api", version = "2.0.0" }
sapphire-ledger-core = { path = "../sapphire-ledger-core", version = "0.1.0", default-features = false }
sapphire-framework = { workspace = true, features = ["ipc", "mcp"] }
rmcp.workspace = true
tokio = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
