[package]
name = "sapphire-ledger-desktop"
version = "0.2.0"
edition.workspace = true
description = "Desktop GUI for sapphire-ledger"
license-file = "LICENSE"
repository.workspace = true
publish = false

[dependencies]
# `eframe`: `gui::app::run` starts the window, and `gui::{eframe, egui}` are the
# versions it renders with.
sapphire-framework = { workspace = true, features = ["eframe", "ipc"] }
# The ledger's methods, their parameters and the records they answer with.
# Nothing of the files: the desktop reads nothing from disk.
sapphire-ledger-api = { path = "../crates/sapphire-ledger-api", version = "2.0.0" }
# Plots for the Charts screen; 0.37 renders with egui 0.36, the framework's.
egui_plot = "0.37"
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing.workspace = true

[dev-dependencies]
# The real server, for the client test: `serve::build()`.
sapphire-ledger = { path = "../cli", default-features = false }
sapphire-ledger-core = { path = "../crates/sapphire-ledger-core", version = "0.2.0", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
